name: Apple · Create signing

# One-off: creates any missing App Store certificates and profiles for a
# platform and pushes them to match-certs. It needs MATCH_GIT_SSH_KEY_WRITE, a
# deploy key with write access on match-certs; add one just for the run and
# delete it (and the secret) afterwards. Everyday builds stay read-only.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        options: [macos, ios]
        default: macos

permissions:
  contents: read

jobs:
  signing:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Require secrets
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_SSH_KEY_WRITE: ${{ secrets.MATCH_GIT_SSH_KEY_WRITE }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          for v in MATCH_PASSWORD MATCH_GIT_SSH_KEY_WRITE APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_KEY_ISSUER_ID APP_STORE_CONNECT_API_KEY_CONTENT; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Load match-certs write key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_SSH_KEY_WRITE }}

      - name: Create and push signing
        env:
          PLATFORM: ${{ inputs.platform }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_URL: git@github.com:MaybeItsSoftware/match-certs.git
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          git config --global user.name "librelog CI"
          git config --global user.email "ci@users.noreply.github.com"
          bundle exec fastlane ios certificates platform:"$PLATFORM" readonly:false
